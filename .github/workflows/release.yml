name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bondar-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: bondar-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bondar-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bondar-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bondar-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bondar${{ runner.os == 'Windows' && '.exe' || '' }} dist/${{ matrix.artifact }}
          cp LICENSE dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute checksums
        run: |
          cd artifacts
          for f in */*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "LICENSE" ] && [ "$(basename "$f")" != "README.md" ]; then
              sha256sum "$f" >> SHA256SUMS
            fi
          done
          cat SHA256SUMS

      - name: Generate release notes
        env:
          REF: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          cp .github/release-notes.md release-notes.md
          {
            echo ""
            echo "### Commits in this release"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --reverse "$PREV_TAG..HEAD" | sed 's/^/- /'
            else
              git log --oneline --reverse | sed 's/^/- /'
            fi
          } >> release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: bondar ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*/*
          fail_on_unmatched_files: true